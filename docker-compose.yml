services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: sqlite:///./data/privyguard.db
    depends_on: [ollama, qdrant]
    volumes: [privyguard_data:/app/data]
volumes:
  ollama_data:
  qdrant_data:
  privyguard_data:
